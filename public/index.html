<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ernesta eSkola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --sky-top:#9EE0FF; --sky-bot:#DDF4FF;
  --card:#FFFFFF; --card2:#F1F6FF;
  --text:#1E2747; --muted:#56618A;
  --ink:#1E2747; --onblock:#1E2747;
  --sun:#FFD23F; --lava:#FF6B3D; --mint:#36D399; --grape:#9B7BFF; --aqua:#4FC3F7; --pink:#FF8FC7;
  --plat:#7ED957; --plat-side:#3E9A3A; --grey:#C9D2E8;
  --good:#2FC787; --bad:#FF5A4E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --sky-top:#0E1838; --sky-bot:#1C2C5E;
    --card:#22305E; --card2:#2A3A70;
    --text:#F2F5FF; --muted:#B4BDE0;
    --ink:#0A1028; --grey:#46558A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --sky-top:#0E1838; --sky-bot:#1C2C5E;
  --card:#22305E; --card2:#2A3A70;
  --text:#F2F5FF; --muted:#B4BDE0;
  --ink:#0A1028; --grey:#46558A;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; min-height:100%;
  font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight:800;
  color:var(--text);
  background:var(--sky-bot);
  background-image:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 70%);
  background-attachment:fixed;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--card); }
h1,h2,h3,.disp{ font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif; font-weight:400; letter-spacing:.01em; margin:0; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:4px solid var(--aqua); outline-offset:3px; }

.wrap{ max-width:900px; margin:0 auto; padding:0 16px 48px; }

/* Top bar */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--card); border-bottom:3px solid var(--ink); }
.top .in{ max-width:900px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:12px; }
.top .who{ display:flex; align-items:center; gap:10px; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
.top .who svg{ width:40px; height:50px; }
.top .nm{ font-family:"Lilita One",sans-serif; font-size:20px; line-height:1; }
.lvl{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:4px; }
.xpbar{ width:90px; height:10px; border:2px solid var(--ink); border-radius:3px; background:var(--card2); overflow:hidden; }
.xpbar i{ display:block; height:100%; background:var(--grape); }
.spacer{ flex:1; }
.coins{ display:flex; align-items:center; gap:6px; font-family:"Lilita One",sans-serif; font-size:22px; }
.coin{ width:22px; height:22px; background:var(--sun); border:3px solid var(--ink); border-radius:4px; transform:rotate(45deg) scale(.8); display:inline-block; }
.iconbtn{ width:40px; height:40px; border:3px solid var(--ink); border-radius:8px; background:var(--card2); cursor:pointer; font-size:18px; display:grid; place-items:center; box-shadow:0 3px 0 var(--ink); }
.iconbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }

/* Block buttons */
.blk{
  --c:var(--sun);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family:"Lilita One",sans-serif; font-size:20px; letter-spacing:.02em;
  color:var(--onblock); background:var(--c);
  border:3px solid var(--ink); border-radius:10px;
  box-shadow:0 6px 0 var(--ink), inset 0 -6px 0 rgba(0,0,0,.14), inset 0 4px 0 rgba(255,255,255,.35);
  padding:12px 18px 14px; cursor:pointer; transition:transform .06s, box-shadow .06s; text-decoration:none; min-height:52px;
}
.blk:active:not(:disabled){ transform:translateY(4px); box-shadow:0 2px 0 var(--ink), inset 0 -6px 0 rgba(0,0,0,.14), inset 0 4px 0 rgba(255,255,255,.35); }
.blk:disabled{ cursor:default; }
.blk.sm{ font-size:16px; padding:8px 12px 10px; min-height:42px; box-shadow:0 4px 0 var(--ink), inset 0 -4px 0 rgba(0,0,0,.14); }
.blk.ghost{ --c:var(--card2); color:var(--text); }
.c-sun{ --c:var(--sun); } .c-lava{ --c:var(--lava); } .c-mint{ --c:var(--mint); } .c-grape{ --c:var(--grape); } .c-aqua{ --c:var(--aqua); } .c-pink{ --c:var(--pink); }

.panel{ background:var(--card); border:3px solid var(--ink); border-radius:14px; box-shadow:0 6px 0 var(--ink); padding:18px; }
.muted{ color:var(--muted); font-weight:600; }
.row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.back{ margin:18px 0 10px; }
.screen-title{ font-size:clamp(28px,6vw,40px); margin:6px 0 4px; line-height:1.05; }
.lead{ margin:0 0 18px; max-width:60ch; font-weight:600; color:var(--muted); font-size:17px; }

/* Home hero */
.hero{ display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; margin:22px 0 26px; }
.island{ position:relative; width:150px; height:190px; }
.island .av{ position:absolute; left:35px; bottom:58px; width:80px; height:100px; animation:bob 2.6s ease-in-out infinite; }
.island .land{ position:absolute; left:0; bottom:16px; width:150px; height:44px; background:var(--plat); border:3px solid var(--ink); border-radius:6px; box-shadow:inset 0 -14px 0 var(--plat-side); }
.island .land::after{ content:""; position:absolute; left:30px; right:30px; top:41px; height:16px; background:#8A5A3B; border:3px solid var(--ink); border-top:0; border-radius:0 0 6px 6px; }
@keyframes bob{ 50%{ transform:translateY(-8px); } }
@media (prefers-reduced-motion: reduce){ .island .av{ animation:none; } }
.hero h1{ font-size:clamp(34px,8vw,58px); line-height:.95; }
.hero p{ margin:8px 0 0; font-weight:600; color:var(--muted); font-size:18px; }

.worlds{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
.world{ position:relative; overflow:hidden; padding:0; }
.world .sky{ height:110px; border-bottom:3px solid var(--ink); position:relative; overflow:hidden; }
.world .sky .bl{ position:absolute; border:3px solid var(--ink); border-radius:4px; font-family:"Lilita One",sans-serif; color:var(--onblock); display:grid; place-items:center; }
.world .body{ padding:16px 18px 18px; }
.world h2{ font-size:28px; }
.world p{ margin:4px 0 14px; font-weight:600; color:var(--muted); }
.world .row .blk{ flex:1 1 auto; font-size:17px; }
.extra{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }

/* Question card */
.qcard{ margin-top:16px; }
.qhead{ display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted); font-weight:800; font-size:15px; }
.prompt{ font-family:"Lilita One",sans-serif; font-size:clamp(34px,9vw,60px); text-align:center; margin:14px 0 6px; line-height:1.05; overflow-wrap:anywhere; }
.prompt.small{ font-size:clamp(22px,5vw,30px); }
.sub{ text-align:center; color:var(--muted); font-weight:700; margin:0 0 14px; font-size:17px; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
.opts.three{ grid-template-columns:repeat(3,1fr); }
.opts.two{ grid-template-columns:1fr 1fr; }
@media (max-width:520px){ .opts.three{ grid-template-columns:1fr; } }
.opts .blk{ font-size:clamp(20px,5vw,30px); min-height:72px; position:relative; }
.opts .blk .k{ position:absolute; left:8px; top:6px; font-size:12px; opacity:.55; font-family:"Nunito",sans-serif; }
.blk.right{ --c:var(--good) !important; }
.blk.wrong{ --c:var(--bad) !important; animation:shake .35s; }
.blk.dim{ opacity:.45; }
@keyframes shake{ 25%{ transform:translateX(-6px);} 75%{ transform:translateX(6px);} }

.words{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0 8px; }
.word{ font-size:clamp(20px,5vw,28px); }
.word.sel{ --c:var(--aqua); transform:translateY(3px); box-shadow:0 3px 0 var(--ink); }
.word.miss{ --c:var(--sun); outline:4px dashed var(--good); outline-offset:2px; }
.dot-end{ font-family:"Lilita One",sans-serif; font-size:28px; align-self:flex-end; }

.feedback{ margin-top:16px; border:3px solid var(--ink); border-radius:12px; padding:12px 14px; font-weight:700; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.feedback.good{ background:color-mix(in srgb, var(--good) 22%, var(--card)); }
.feedback.bad{ background:color-mix(in srgb, var(--bad) 18%, var(--card)); }
.feedback .t{ flex:1 1 240px; font-size:17px; }
.feedback b{ font-family:"Lilita One",sans-serif; font-weight:400; font-size:22px; display:block; }

.passage{ background:var(--card2); border:3px solid var(--ink); border-radius:12px; padding:12px 16px; margin-bottom:6px; }
.passage h3{ font-size:22px; margin-bottom:6px; }
.passage p{ margin:0; font-weight:600; line-height:1.6; font-size:18px; max-width:65ch; }
.opts.three .blk{ font-size:clamp(17px,3.8vw,24px); }
.mission{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:18px; background:color-mix(in srgb,var(--sun) 30%, var(--card)); }
.mission > div{ flex:1 1 260px; }
.mission h2{ font-size:28px; }
.mission p{ margin:4px 0 0; }
/* Obby track */
.obby{ position:relative; height:170px; overflow:hidden; border:3px solid var(--ink); border-radius:14px; background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)); box-shadow:0 6px 0 var(--ink); }
.track{ position:absolute; inset:0; transition:transform .45s cubic-bezier(.4,1.3,.5,1); }
.plat{ position:absolute; width:64px; height:22px; background:var(--plat); border:3px solid var(--ink); border-radius:4px; box-shadow:inset 0 -8px 0 var(--plat-side); }
.plat.cp{ background:var(--sun); box-shadow:inset 0 -8px 0 #C99A00; }
.plat .num{ position:absolute; top:24px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); }
.flag{ position:absolute; width:4px; height:38px; background:var(--ink); }
.flag::after{ content:""; position:absolute; left:4px; top:0; width:22px; height:14px; background:var(--lava); border:2px solid var(--ink); }
.runner{ position:absolute; width:44px; height:55px; transition:left .45s cubic-bezier(.4,1.3,.5,1), bottom .45s; z-index:2; }
.runner.jump svg{ animation:hop .45s; }
.runner.oops svg{ animation:oops .6s; }
@keyframes hop{ 40%{ transform:translateY(-36px) rotate(-8deg);} }
@keyframes oops{ 30%{ transform:translateY(14px) rotate(14deg);} 60%{ transform:translateY(-4px) rotate(-6deg);} }
@media (prefers-reduced-motion: reduce){ .track,.runner{ transition:none; } .runner svg{ animation:none !important; } }
.lava{ position:absolute; left:0; right:0; bottom:0; height:18px; background:var(--lava); border-top:3px solid var(--ink); }
.hud{ position:absolute; top:8px; left:10px; right:10px; display:flex; justify-content:space-between; z-index:3; font-family:"Lilita One",sans-serif; font-size:18px; }
.hud span{ background:var(--card); border:3px solid var(--ink); border-radius:8px; padding:2px 10px; }

.progressbar{ height:22px; border:3px solid var(--ink); border-radius:8px; background:var(--card2); overflow:hidden; margin:10px 0 4px; display:flex; }
.progressbar i{ display:block; height:100%; border-right:2px solid var(--ink); }

/* chips */
.chips{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{ min-width:56px; }
.chip[aria-pressed="true"]{ --c:var(--mint); }
.chip[aria-pressed="false"]{ --c:var(--card2); color:var(--text); }

/* Learn */
.ttable{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.trow{ display:flex; justify-content:space-between; gap:8px; border:3px solid var(--ink); border-radius:10px; padding:8px 12px; background:var(--card2); cursor:pointer; font-family:"Lilita One",sans-serif; font-size:22px; text-align:left; }
.trow .d{ color:var(--muted); font-size:18px; }
.trow[aria-pressed="true"]{ background:color-mix(in srgb,var(--sun) 55%, var(--card)); }
@media (max-width:520px){ .ttable{ grid-template-columns:1fr; } }
.grid-vis{ display:grid; gap:4px; justify-content:start; margin:12px 0; }
.grid-vis i{ width:22px; height:22px; border:2px solid var(--ink); border-radius:3px; background:var(--aqua); box-shadow:inset 0 -5px 0 rgba(0,0,0,.18); }
.grid-vis i.alt{ background:var(--grape); }
.tips{ display:grid; gap:10px; margin-top:6px; }
.tip{ border-left:6px solid var(--grape); padding:6px 12px; background:var(--card2); border-radius:0 8px 8px 0; font-weight:700; }
.tip em{ font-style:normal; color:var(--muted); font-weight:600; }

.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.lcard h3{ font-size:26px; display:flex; align-items:center; gap:10px; }
.lcard .badge{ display:inline-block; font-family:"Nunito",sans-serif; font-weight:900; font-size:15px; border:3px solid var(--ink); border-radius:6px; padding:1px 8px; background:var(--sun); color:var(--onblock); }
.lcard p{ font-weight:600; margin:8px 0; line-height:1.45; }
.ex{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
.ex span{ border:2px solid var(--ink); border-radius:6px; padding:2px 8px; background:var(--card2); font-weight:800; }
.hl-n{ background:color-mix(in srgb,var(--aqua) 55%, var(--card)) !important; }
.hl-v{ background:color-mix(in srgb,var(--lava) 50%, var(--card)) !important; }
.hl-a{ background:color-mix(in srgb,var(--mint) 55%, var(--card)) !important; }
.ends{ width:100%; border-collapse:collapse; margin:8px 0 12px; font-weight:700; }
.ends td,.ends th{ border:2px solid var(--ink); padding:6px 8px; text-align:left; }
.ends th{ background:var(--card2); font-family:"Lilita One",sans-serif; font-weight:400; }

/* Progress */
.stats4{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.stat{ text-align:center; padding:12px; }
.stat .v{ font-family:"Lilita One",sans-serif; font-size:36px; line-height:1; }
.stat .l{ color:var(--muted); font-weight:700; margin-top:4px; }
.tiles{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px; }
.tile{ border:3px solid var(--ink); border-radius:10px; padding:8px 4px; text-align:center; background:var(--grey); color:var(--onblock); cursor:pointer; }
.tile .x{ font-family:"Lilita One",sans-serif; font-size:22px; }
.tile .p{ font-size:13px; }
.tile.m0{ background:var(--grey); color:var(--text); }
.tile.m1{ background:var(--lava); } .tile.m2{ background:var(--sun); } .tile.m3{ background:var(--mint); }
.bars{ display:grid; gap:12px; margin-top:10px; }
.barrow .lab{ display:flex; justify-content:space-between; font-weight:800; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-top:10px; font-weight:700; }
.legend i{ display:inline-block; width:14px; height:14px; border:2px solid var(--ink); border-radius:3px; vertical-align:-2px; margin-right:4px; }
.chart{ display:flex; align-items:flex-end; gap:8px; height:140px; margin-top:12px; border-bottom:3px solid var(--ink); padding:0 4px; }
.chart .col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; min-width:0; }
.chart .col i{ display:block; width:100%; max-width:40px; border:3px solid var(--ink); border-bottom:0; border-radius:4px 4px 0 0; }
.chart .col span{ font-size:12px; color:var(--muted); }
.hist{ display:grid; gap:6px; margin-top:12px; }
.hist div{ display:flex; justify-content:space-between; gap:8px; border-bottom:2px dashed var(--grey); padding:4px 0; font-weight:700; }
.section{ margin-top:22px; }
.section h2{ font-size:26px; margin-bottom:4px; }

/* Results */
.stars{ display:flex; justify-content:center; gap:10px; margin:10px 0; }
.star{ width:56px; height:56px; }
.big{ font-family:"Lilita One",sans-serif; font-size:64px; text-align:center; line-height:1; }

/* Shop */
.shopgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:10px; }
.item{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 8px; cursor:pointer; text-align:center; }
.item svg{ width:56px; height:70px; }
.item.on{ background:color-mix(in srgb,var(--mint) 35%, var(--card)); }
.item .price{ display:flex; align-items:center; gap:4px; font-family:"Lilita One",sans-serif; }
.item .price .coin{ width:16px; height:16px; border-width:2px; }
.namefield{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.namefield input{ font:inherit; font-size:20px; padding:10px 12px; border:3px solid var(--ink); border-radius:10px; background:var(--card2); color:var(--text); flex:1 1 200px; min-width:0; }

.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(140%); background:var(--sun); color:var(--onblock); border:3px solid var(--ink); border-radius:12px; padding:10px 18px; font-family:"Lilita One",sans-serif; font-size:20px; box-shadow:0 5px 0 var(--ink); transition:transform .3s; z-index:20; }
.toast{ visibility:hidden; transform:translateX(-50%) translateY(calc(100% + 60px)); transition:transform .3s, visibility .3s; }
.toast.show{ visibility:visible; transform:translateX(-50%) translateY(0); }

/* ===== Balvas ===== */
.coins{ margin-left:auto; }
.top .who svg[data-form="champ"]{ width:50px; height:56px; }
.island{ width:200px; }
.island .land{ width:200px; }
.island .av[data-form="champ"]{ left:14px; bottom:52px; width:118px; height:131px; }
.island .catpet{ position:absolute; left:136px; bottom:58px; width:62px; }
.island .catpet svg{ width:100%; display:block; }
@media (max-width:560px){ .hero{ grid-template-columns:1fr; } }
.runner.champ{ width:56px; height:62px; }
.spark{ animation:twinkle 1.6s ease-in-out infinite; } .spark.s2{ animation-delay:.5s; } .spark.s3{ animation-delay:1s; }
@keyframes twinkle{ 50%{ opacity:.2; } }

.petlane{ flex:1; position:relative; height:44px; min-width:40px; overflow:hidden; }
.pet{ position:absolute; bottom:0; left:0; width:52px; height:40px; padding:0; border:0; background:none; cursor:pointer; animation:petwalk 16s linear infinite; }
.pet .flip{ display:block; width:100%; height:100%; animation:petflip 16s steps(1,end) infinite; }
.pet svg{ width:100%; height:100%; display:block; }
.pet.hop svg{ animation:pethop .5s; }
@keyframes petwalk{ 0%,4%{ left:0; } 46%,54%{ left:calc(100% - 52px); } 96%,100%{ left:0; } }
@keyframes petflip{ 0%{ transform:scaleX(1); } 50%{ transform:scaleX(-1); } }
@keyframes pethop{ 40%{ transform:translateY(-14px); } }
.catsvg .lg{ transform-box:fill-box; transform-origin:50% 0; }
.catsvg.walking .lg.a{ animation:leg .45s ease-in-out infinite alternate; }
.catsvg.walking .lg.b{ animation:leg .45s ease-in-out infinite alternate-reverse; }
@keyframes leg{ from{ transform:rotate(16deg); } to{ transform:rotate(-16deg); } }
.catsvg .tail{ transform-box:fill-box; transform-origin:50% 100%; animation:tail 1.1s ease-in-out infinite alternate; }
@keyframes tail{ from{ transform:rotate(-14deg); } to{ transform:rotate(14deg); } }
@media (max-width:520px){
  .top .in{ flex-wrap:wrap; row-gap:0; }
  .petlane{ order:9; flex:1 1 100%; height:0; }
  .top .in{ gap:8px; } .xpbar{ width:56px; } .petlane{ min-width:0; }
  .petlane.has{ height:42px; }
}

.tro{ width:56px; height:63px; }
.shelf{ display:flex; gap:6px; margin-top:10px; }
.shelf .tro{ width:40px; height:45px; }

.teaser{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
.teaser .thumbs{ display:flex; gap:8px; }
.teaser .thumbs img{ width:64px; height:64px; object-fit:cover; border:3px solid var(--ink); border-radius:10px; background:#111; }
.teaser .txt{ flex:1 1 240px; }
.teaser h2{ font-size:26px; }

.road{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:10px; }
.mile{ display:flex; flex-direction:column; gap:8px; }
.mile.got{ background:color-mix(in srgb,var(--mint) 22%, var(--card)); }
.mile-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
.mile-num{ display:inline-flex; align-items:center; gap:6px; font-family:"Lilita One",sans-serif; font-size:24px; }
.okbadge{ border:3px solid var(--ink); border-radius:8px; background:var(--good); color:var(--onblock); padding:2px 10px; font-size:14px; font-weight:900; }
.mile-art{ display:flex; align-items:flex-end; justify-content:center; gap:10px; min-height:96px; background:var(--card2); border:3px solid var(--ink); border-radius:12px; padding:10px; }
.mile-art svg{ height:76px; width:auto; }
.mile h3{ font-size:22px; }
.mile p{ margin:0; font-weight:600; }
.grand{ margin-top:16px; background:linear-gradient(160deg, color-mix(in srgb,var(--sun) 45%, var(--card)), var(--card) 65%); }
.grand .ribbon{ display:inline-block; background:var(--lava); color:var(--onblock); border:3px solid var(--ink); border-radius:8px; padding:3px 12px; font-family:"Lilita One",sans-serif; font-size:16px; letter-spacing:.06em; }
.grand h3{ font-size:clamp(26px,5vw,34px); margin:10px 0 4px; }
.prizes{ display:grid; grid-template-columns:1fr 1.6fr; gap:14px; margin:14px 0; }
.prizes figure{ margin:0; border:3px solid var(--ink); border-radius:12px; overflow:hidden; background:#111; position:relative; box-shadow:0 5px 0 var(--ink); display:flex; flex-direction:column; }
.prizes img{ display:block; width:100%; height:220px; object-fit:cover; }
.prizes img.contain{ object-fit:contain; }
.prizes figcaption{ margin-top:auto; background:var(--card); border-top:3px solid var(--ink); padding:8px 10px; font-family:"Lilita One",sans-serif; font-size:18px; }
@media (max-width:560px){ .prizes{ grid-template-columns:1fr 1fr; } .prizes img{ height:140px; } .prizes figcaption{ font-size:15px; } }
.lockbadge{ position:absolute; top:8px; left:8px; background:var(--card); border:3px solid var(--ink); border-radius:8px; padding:2px 8px; font-size:15px; }
.gsteps{ display:grid; gap:12px; }
.gstep{ background:var(--card); border:3px solid var(--ink); border-radius:12px; padding:12px; }
.gstep h4{ margin:0 0 4px; font-family:"Lilita One",sans-serif; font-weight:400; font-size:20px; }
.segs{ display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin:10px 0 0; }
.seg{ border:2px solid var(--ink); border-radius:6px; text-align:center; font-family:"Lilita One",sans-serif; font-size:14px; padding:4px 0; background:var(--grey); color:var(--onblock); cursor:pointer; }
.seg.ok{ background:var(--mint); }
.bk{ width:100%; font:600 13px ui-monospace,Menlo,Consolas,monospace; padding:8px; border:3px solid var(--ink); border-radius:10px; background:var(--card2); color:var(--text); resize:vertical; }

.modal{ position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(10,16,40,.55); }
.modalbox{ position:relative; max-width:460px; width:100%; text-align:center; animation:pop .4s cubic-bezier(.3,1.5,.5,1); }
.modalbox h2{ font-size:34px; margin:10px 0 6px; }
.modalbox p{ font-weight:700; margin:0 0 16px; font-size:17px; }
.m-art{ display:flex; justify-content:center; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.m-art svg{ height:96px; width:auto; }
.m-art img{ height:110px; max-width:46%; object-fit:cover; border:3px solid var(--ink); border-radius:10px; background:#111; }
@keyframes pop{ from{ transform:scale(.6); opacity:0; } }
.confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.confetti i{ position:absolute; top:-20px; width:12px; height:12px; border:2px solid var(--ink); border-radius:2px; animation:fall 2.8s linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce){
  .pet,.pet .flip,.catsvg *,.spark,.modalbox{ animation:none !important; }
  .confetti{ display:none; }
}
</style>
</head>

function emptyState(){
  const t = {}; for(let i=1;i<=10;i++) t[i]={c:0,t:0,r:[]};

    tests:[], bestStreak:0, totalCorrect:0, lastMission:'', updated:0,
    earned:0, rewards:{trophy:0, cat:0, grand:0}, grandScore:0, examBest:0, form:'normal', catName:'Minka', petOn:true };
}
function normalize(s){
  const e = emptyState();
  if(!s || typeof s!=='object') return e;
  const out = Object.assign(e, s);
  out.stats = Object.assign(emptyState().stats, s.stats||{});
  out.stats.lv = Object.assign(emptyState().stats.lv, (s.stats&&s.stats.lv)||{});
  out.stats.ex = Object.assign(emptyState().stats.ex, (s.stats&&s.stats.ex)||{});
  for(let i=1;i<=10;i++){ out.stats.mul[i]=out.stats.mul[i]||{c:0,t:0}; out.stats.div[i]=out.stats.div[i]||{c:0,t:0}; }
  // Vecajam progresam nav pēdējo atbilžu saraksta: izveido to no kopējās statistikas (kļūdas — kā vecākās)
  ['mul','div'].forEach(g=>{ for(let i=1;i<=10;i++){ const o=out.stats[g][i];
    if(!Array.isArray(o.r)){ const n=Math.min(o.t||0, MASTER_N), k=o.t? Math.round(n*(o.c||0)/o.t) : 0; o.r=[...Array(n-k).fill(0), ...Array(k).fill(1)]; } } });
  if(!Array.isArray(out.owned)) out.owned=['aqua','lime','none'];
  if(!Array.isArray(out.tests)) out.tests=[];
  // Kopā nopelnītās monētas: ja vecajā progresā to nav, = esošās monētas + iztērētais pēc vecajām cenām
  if(typeof s.earned!=='number') out.earned = (out.coins||0) + out.owned.reduce((sum,id)=>sum+(OLD_PRICE[id]||0),0);
  out.rewards = Object.assign({trophy:0, cat:0, grand:0}, s.rewards||{});
  if(!out.rewards.trophy) out.form='normal';
  return out;
}

/* ============ GLABĀŠANA SERVERĪ (Netlify) ============ */
const cloud = { ok:false, ready:false, timer:null, last:0, msg:'' };
const cloudAvail = /^https?:$/.test(location.protocol) && !/claude\.(ai|site)$|claudeusercontent/.test(location.hostname);
async function cloudFetch(method, qs='', body){
  const opt = { method, headers:{} };
  if(body!==undefined){ opt.headers['content-type']='application/json'; opt.body=JSON.stringify(body); if(opt.body.length<60000) opt.keepalive=true; }
  const r = await fetch('/api/progress'+qs, opt);
  let data=null; try{ data = await r.json(); }catch(e){}
  return { status:r.status, data };
}
function cloudAdopt(st){
  S = normalize(JSON.parse(JSON.stringify(st)));
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  petKey=''; renderTop(); if(['home','progress','shop'].includes(current)) go(current);
}
async function cloudPull(){
  if(!cloudAvail) return null;
  const localAt = S.updated||0;
  try{
    const r = await cloudFetch('GET');
    if(r.status!==200){ cloud.ok=false; cloud.msg='Serveris nav pieejams ('+r.status+')'; return r; }
    cloud.ok=true; cloud.ready=true; cloud.msg='';
    const st = r.data && r.data.state;
    if(st && (st.updated||0) > localAt){ cloudAdopt(st); cloud.last=Date.now(); }
    else if((S.updated||0) > (st ? (st.updated||0) : 0)){ await cloudPush(); }
    else cloud.last=Date.now();
    return r;
  }catch(e){ cloud.ok=false; cloud.msg='Nav interneta savienojuma'; return null; }
  finally{ cloudUI(); }
}
async function cloudPush(){
  if(!cloudAvail || !cloud.ready) return;
  clearTimeout(cloud.timer); cloud.timer=null;
  try{
    const r = await cloudFetch('PUT','',{state:S});
    if(r.status===200){ cloud.ok=true; cloud.last=Date.now(); cloud.msg=''; }
    else if(r.status===409 && r.data && r.data.state){ cloudAdopt(r.data.state); cloud.ok=true; cloud.last=Date.now(); }
    else { cloud.ok=false; cloud.msg='Neizdevās saglabāt ('+r.status+')'; }
  }catch(e){ cloud.ok=false; cloud.msg='Nav interneta savienojuma, saglabās vēlāk'; }
  cloudUI();
}
function cloudSchedule(){ if(!cloudAvail || !cloud.ready) return; clearTimeout(cloud.timer); cloud.timer=setTimeout(cloudPush, 1500); }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ if(cloud.timer) cloudPush(); }
  else cloudPull();
});
function cloudStatusHTML(){
  if(!cloudAvail) return 'Darbojas tikai tiešsaistes versijā (ernesta-eskola.netlify.app).';
  if(cloud.ok) return `🟢 Saglabājas serverī. Pēdējoreiz: ${cloud.last? new Date(cloud.last).toLocaleTimeString('lv-LV',{hour:'2-digit',minute:'2-digit'}) : '—'}`;
  return '🔴 '+esc(cloud.msg||'Savienojas…');
}
function cloudUI(){ const el=document.getElementById('cloudStatus'); if(el) el.innerHTML=cloudStatusHTML(); }

// Sinhronizē progresu starp ierīcēm, ja lapa atvērta claude.ai (nav obligāti)
(async ()=>{
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const db = await window.claude.use('db'); const user = await window.claude.use('user');
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.collection('data/users/'+id).doc('progress');
    const snap = await ref.get();
    if(snap.exists){
      const r = snap.data() && snap.data().state;
      if(r && (r.updated||0) > (S.updated||0)){ S = normalize(JSON.parse(JSON.stringify(r))); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderTop(); if(current==='home'||current==='progress') go(current); }
    }
    remoteRef = ref;
    if(!snap.exists && S.updated) ref.set({state: JSON.parse(JSON.stringify(S))}).catch(()=>{});
  }catch(e){}
})();

function makeOpts(ans, cands, n=4){
  const set = new Set([ans]);
  for(const c of shuffle(cands)){ if(set.size>=n) break; if(c>0 && c!==ans) set.add(c); }
  let guard=0; while(set.size<n && guard++<50){ const c = ans + rnd(-6,6); if(c>0) set.add(c); }
  return shuffle([...set]);
}
function qMath(tables, op){
  const a = pick(tables), b = rnd(1,10);
  const div = op==='div' || (op==='mix' && Math.random()<.5);
  if(!div){
    const ans=a*b, flip = Math.random()<.3;
    return { kind:'choice', prompt: flip?`${b} × ${a} = ?`:`${a} × ${b} = ?`, answer:ans,
      options: makeOpts(ans,[ans+a,ans-a,ans+b,ans-b,ans+1,ans-1,ans+10]),
      skill:['mul',a], explain:`${a} × ${b} = ${ans}` + (b>1?` — tas ir ${b} reizes pa ${a}.`:'.') };
  }
  const p=a*b;
  return { kind:'choice', prompt:`${p} : ${a} = ?`, answer:b,
    options: makeOpts(b,[b+1,b-1,b+2,b-2,a,b+3]),
    skill:['div',a], explain:`${p} : ${a} = ${b}, jo ${a} × ${b} = ${p}.` };
}
function qPos(){
  const t = pick(['n','v','a']); const w = pick(t==='n'?NOUNS:t==='v'?VERBS:ADJS);
  return { kind:'choice', prompt:w, small:false, sub:'Kas tas ir par vārdu?', answer:POS[t].label,
    options:['n','v','a'].map(k=>POS[k].label), colors:['c-aqua','c-lava','c-mint'], layout:'three',
    skill:['lv','pos'], explain:`${w} — ${POS[t].label.toLowerCase()}, jo atbild uz jautājumu ${POS[t].q}` };
}
function qNum(){
  const r = Math.random();
  if(r<.12){
    const w = pick(ONLY_PLURAL);
    return { kind:'choice', prompt:w, sub:'Kas? Viens vai daudz?', answer:'Daudzskaitlis', options:['Vienskaitlis','Daudzskaitlis'], colors:['c-sun','c-grape'], layout:'two',
      skill:['lv','num'], explain:`${w} — vienmēr daudzskaitlī, pat ja tās ir tikai vienas!` };
  }
  const e = pick(PLURALS);
  if(r<.55){
    const pl = Math.random()<.5, w = pl?e[1]:e[0];
    return { kind:'choice', prompt:w, sub:'Kas? Viens vai daudz?', answer: pl?'Daudzskaitlis':'Vienskaitlis', options:['Vienskaitlis','Daudzskaitlis'], colors:['c-sun','c-grape'], layout:'two',
      skill:['lv','num'], explain: pl?`${e[1]} — daudzskaitlis (daudz). Vienskaitlī: ${e[0]}.`:`${e[0]} — vienskaitlis (viens). Daudzskaitlī: ${e[1]}.` };
  }
  return { kind:'choice', prompt:`viens ${e[0]} → daudz …`, small:true, sub:'Izvēlies pareizo daudzskaitli', answer:e[1], options:shuffle([e[1],e[2],e[3]]), layout:'three',
    skill:['lv','num'], explain:`viens ${e[0]}, daudz ${e[1]}.` };
}
function qSent(){
  const s = pick(SENTENCES);
  const tasks = ['n','v','S','I']; if(s.some(w=>w[1]==='a')) tasks.push('a');
  const t = pick(tasks);
  let target, label, skill;
  if(t==='S'){ target=s.map((w,i)=>w[2]==='S'?i:-1).filter(i=>i>=0); label='Atrodi teikuma priekšmetu — kas? par ko stāsta teikums'; skill='subj'; }
  else if(t==='I'){ target=s.map((w,i)=>w[2]==='I'?i:-1).filter(i=>i>=0); label='Atrodi izteicēju — ko dara teikuma priekšmets?'; skill='subj'; }
  else { target=s.map((w,i)=>w[1]===t?i:-1).filter(i=>i>=0); label=`Pieskaries visiem vārdiem, kas ir ${ {n:'lietvārdi (kas?)',v:'darbības vārdi (ko dara?)',a:'īpašības vārdi (kāds? kāda?)'}[t] }`; skill='sent'; }
  const words = target.map(i=>s[i][0]).join(', ');
  const name = {n:'Lietvārdi',v:'Darbības vārds',a:'Īpašības vārdi',S:'Teikuma priekšmets',I:'Izteicējs'}[t];
  return { kind:'tap', words:s.map(w=>w[0]), target, sub:label, skill:['lv',skill], explain:`${name}: ${words}.` };
}
function qRead(){
  const t = pick(READING), qq = pick(t.q);
  return { kind:'choice', passage:{t:t.t, p:t.p}, prompt:qq[0], small:true, answer:qq[1], options:shuffle(qq.slice(1)), layout:'three',
    skill:['lv','read'], explain:`Pareizā atbilde: ${qq[1]}. Ja nezini, izlasi tekstu vēlreiz un atrodi to vietu.` };
}
function qLv(mode){
  if(mode==='pos') return qPos(); if(mode==='num') return qNum(); if(mode==='sent') return qSent(); if(mode==='read') return qRead();
  return pick([qPos,qNum,qSent,qRead])();
}

function qWord(){

  const T = [
    ()=>[`Ernests uzbūvēja ${a} torņus. Katrā tornī ir ${b} klucīši. Cik klucīšu ir pavisam?`, p, `${a} × ${b} = ${p}`],
    ()=>[`Vienā lādē ir ${b} dimanti. Cik dimantu ir ${a} lādēs?`, p, `${a} × ${b} = ${p}`],
    ()=>[`Uz ${a} plauktiem katrā ir ${b} grāmatas. Cik grāmatu ir pavisam?`, p, `${a} × ${b} = ${p}`],
    ()=>[`Viena biļete maksā ${b} eiro. Cik eiro maksās ${a} biļetes?`, p, `${a} × ${b} = ${p}`],
    ()=>[`${a} draugi vienādi sadala ${p} ${nf(p,'monētu','monētas')}. Cik monētu dabū katrs?`, b, `${p} : ${a} = ${b}`],
    ()=>[`Ernestam ir ${p} ${nf(p,'uzlīme','uzlīmes')}. Katrā albuma lapā viņš ielīmē ${b}. Cik lapu viņš aizpilda?`, a, `${p} : ${b} = ${a}`],
    ()=>[`No ${p} ${nf(p,'ābola','āboliem')} saliek grozus, katrā pa ${b} āboliem. Cik grozu sanāk?`, a, `${p} : ${b} = ${a}`],
    ()=>[`${p} ${nf(p,'klucīti','klucīšus')} saliek ${a} vienādos torņos. Cik klucīšu ir katrā tornī?`, b, `${p} : ${a} = ${b}`],
  ];
  const [text, ans, ex] = pick(T)();
  return { kind:'choice', prompt:text, small:true, sub:'Padomā: reizināt vai dalīt?', answer:ans,
    options:makeOpts(ans,[ans+a,ans-a,ans+b,ans-b,a+b,ans+1,ans-1]), skill:['ex','word'], explain:`${ex}. Atbilde: ${ans}.` };
}
// Reizināšana un dalīšana ar 10 un 100 (līdz 1000)
function qTen(){
  const mk=(prompt,ans,cands,explain)=>({kind:'choice',prompt,answer:ans,options:makeOpts(ans,cands),skill:['ex','ten'],explain});
  const r=Math.random();
  if(r<.3){ const a=rnd(2,99), ans=a*10; return mk(`${a} × 10 = ?`, ans, [ans+10,ans-10,a+10,a,ans+1], `Reizinot ar 10, skaitļa galā pieliek vienu nulli: ${a} × 10 = ${ans}.`); }
  if(r<.5){ const a=rnd(2,9), ans=a*100; return mk(`${a} × 100 = ?`, ans, [a*10,ans+100,ans-100,a+100], `Reizinot ar 100, pieliek divas nulles: ${a} × 100 = ${ans}.`); }
  if(r<.8){ const a=rnd(2,99), p=a*10; return mk(`${p} : 10 = ?`, a, [a+10,a-10,a+1,a-1,p], `Dalot ar 10, skaitļa galā nomet vienu nulli: ${p} : 10 = ${a}.`); }
  const a=rnd(2,9), p=a*100; return mk(`${p} : 100 = ?`, a, [a*10,a+1,a-1,a+10], `Dalot ar 100, nomet divas nulles: ${p} : 100 = ${a}.`);
}
// Darbību īpašības un nezināmais skaitlis
function qProp(){
  const a=rnd(2,10), b=rnd(2,10), p=a*b, r=Math.random();
  const mk=(prompt,ans,cands,explain)=>({kind:'choice',prompt,answer:ans,options:makeOpts(ans,cands),skill:['ex','prop'],explain});
  if(r<.34) return mk(`${a} × ${b} = ${b} × ?`, a, [b,a+1,a-1,p], `Reizinātājus var samainīt vietām: ${a} × ${b} = ${b} × ${a}.`);
  if(r<.67) return mk(`? × ${b} = ${p}`, a, [a+1,a-1,b,p-b], `Nezināmo atrod ar dalīšanu: ${p} : ${b} = ${a}. Pārbaude: ${a} × ${b} = ${p}.`);
  return mk(`${p} : ? = ${b}`, a, [a+1,a-1,b,p-b], `${p} : ${a} = ${b}, jo ${a} × ${b} = ${p}.`);
}
function mathTest(){

function weakTables(){
  return [2,3,4,5,6,7,8,9,10].map(n=>{ const c=S.stats.mul[n].c+S.stats.div[n].c, t=S.stats.mul[n].t+S.stats.div[n].t; return {n, p:t? c/t : .5}; })
    .sort((x,y)=>x.p-y.p).slice(0,4).map(x=>x.n);
}
function missionQs(){
  const W=weakTables();
  return shuffle([...Array.from({length:6},()=>qMath(W,'mix')), qWord(), qWord(), qWord(), qTen(), qProp(), qRead(), qRead(), qPos(), qNum()]);
}

function record(q, ok){
  const [g,k] = q.skill; const o = g==='lv'? S.stats.lv[k] : S.stats[g][k];
  const before = (g==='mul'||g==='div') && isMastered(o);
  o.t++; if(ok) o.c++;
  if(g==='mul'||g==='div'){
    o.r = (o.r||[]).concat(ok?1:0).slice(-MASTER_N);
    if(!before && isMastered(o)) setTimeout(()=>{ beep('coin'); toast(`Tabula ${g==='mul'?'×':':'} ${k} apgūta! ${masteredCount()}/20`); }, 400);
  }
  if(ok){ S.totalCorrect++; }
}

let keyHandler = null;
document.addEventListener('keydown', e=>{ if(celebOpen) return; if(keyHandler) keyHandler(e); });

function renderQ(el, q, done){
  keyHandler = null;
  let html = `<div class="panel qcard">`;
  if(q.kind==='choice'){
    html += `${q.passage?`<div class="passage"><h3>${esc(q.passage.t)}</h3><p>${esc(q.passage.p)}</p></div>`:''}<div class="prompt ${q.small?'small':''}">${esc(q.prompt)}</div>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:''}
      <div class="opts ${q.layout||''}">${q.options.map((o,i)=>`<button class="blk ${q.colors?q.colors[i]:['c-sun','c-aqua','c-mint','c-pink'][i]}" data-i="${i}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
  } else {
    html += `<p class="sub" style="margin-top:4px">${esc(q.sub)}</p><div class="words">${q.words.map((w,i)=>`<button class="blk ghost word" data-i="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}<span class="dot-end">.</span></div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="blk c-mint" id="checkBtn">Pārbaudīt</button></div>`;
  }
  html += `<div id="fb"></div></div>`;
  el.innerHTML = html;

  const finish = (ok)=>{
    const fb = $('#fb', el);
    fb.innerHTML = `<div class="feedback ${ok?'good':'bad'}"><div class="t"><b>${ok?pick(PRAISE):'Gandrīz!'}</b>${esc(q.explain)}</div><button class="blk ${ok?'c-mint':'c-sun'}" id="nextBtn">${ok?'Tālāk':'Sapratu, tālāk'}</button></div>`;
    const nb = $('#nextBtn', el); nb.focus({preventScroll:true});
    let gone=false; const next=()=>{ if(gone) return; gone=true; keyHandler=null; done(ok); };
    nb.onclick = next;
    keyHandler = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); next(); } };
    if(ok) setTimeout(next, 1100);
  };

  if(q.kind==='choice'){
    const btns = [...el.querySelectorAll('.opts .blk')];
    const answer = i=>{
      if(btns[0].disabled) return;
      const ok = q.options[i]===q.answer;
      btns.forEach((b,j)=>{ b.disabled=true; if(q.options[j]===q.answer) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); else b.classList.add('dim'); });
      finish(ok);
    };
    btns.forEach((b,i)=>b.onclick=()=>answer(i));
    keyHandler = e=>{ const n=parseInt(e.key,10); if(n>=1 && n<=btns.length) answer(n-1); };
  } else {
    const btns = [...el.querySelectorAll('.word')];
    btns.forEach(b=>b.onclick=()=>{ if(b.disabled) return; const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); b.classList.toggle('sel',on); });
    $('#checkBtn',el).onclick = ()=>{
      const sel = btns.map((b,i)=>b.getAttribute('aria-pressed')==='true'?i:-1).filter(i=>i>=0);
      if(!sel.length){ toast('Pieskaries vismaz vienam vārdam'); return; }
      const ok = sel.length===q.target.length && sel.every(i=>q.target.includes(i));
      btns.forEach((b,i)=>{ b.disabled=true; b.classList.remove('sel','ghost'); const t=q.target.includes(i), s=sel.includes(i);
        if(t&&s) b.classList.add('right'); else if(s) b.classList.add('wrong'); else if(t) b.classList.add('miss'); else { b.classList.add('ghost','dim'); } });
      $('#checkBtn',el).remove();
      finish(ok);
    };
  }
}

/* ============ PRACTICE (obby) ============ */
const STEP = 92;
function platY(i){ return [36,58,44,70,50,40,64,48][i%8]; }
function viewPractice(app, opts){
  const sess = {pos:0, streak:0, correct:0, total:0, coins:0};
  const SPECIAL = {word:qWord, ten:qTen, prop:qProp};
  const genQ = ()=> opts.world==='math'? (SPECIAL[opts.mode]? SPECIAL[opts.mode]() : qMath(opts.tables, opts.op)) : qLv(opts.mode||'mix');
  const title = (opts.world==='math' && SPECIAL[opts.mode]) ? ({word:'Teksta uzdevumi',ten:'Reizināšana un dalīšana ar 10 un 100',prop:'Atrodi nezināmo skaitli'})[opts.mode]
    : opts.world==='math'
    ? `Tabulas: ${opts.tables.join(', ')} · ${ {mul:'reizināšana',div:'dalīšana',mix:'reizināšana un dalīšana'}[opts.op] }`
    : ({pos:'Kas tas par vārdu?',num:'Viens vai daudz?',sent:'Teikuma detektīvs',read:'Lasi un atbildi',mix:'Viss kopā'})[opts.mode||'mix'];
  app.innerHTML = `${backBtn(opts.world==='math'?'mathSetup':'lv','Beigt')}
    <div class="obby" id="obby"><div class="hud"><span id="hudStreak">Sērija 0</span><span id="hudCoins">+0</span></div>
      <div class="track" id="track"></div><div class="runner${S.form==='champ'?' champ':''}" id="runner">${avatarSVG(S.color,S.hat)}</div><div class="lava"></div></div>
    <p class="muted" style="margin:12px 2px 0">${esc(title)}</p>
    <div id="qbox"></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="blk sm ghost" id="endBtn">Beigt un redzēt rezultātu</button></div>`;
  const back = app.querySelector('[data-go]'); back.onclick = ()=>finishSession();
  const track = $('#track'), runner = $('#runner');
  let built = 0;
  function build(upTo){ for(;built<=upTo;built++){ const cp = built>0 && built%10===0; const y=platY(built);
      track.insertAdjacentHTML('beforeend', `<div class="plat ${cp?'cp':''}" style="left:${built*STEP+20}px;bottom:${y}px"><span class="num">${built}</span></div>${cp?`<div class="flag" style="left:${built*STEP+48}px;bottom:${y+22}px"></div>`:''}`); } }
  function place(){ build(sess.pos+8); const x = sess.pos*STEP+20; runner.style.left = (x+10 - Math.max(0,sess.pos*STEP-60))+'px'; runner.style.bottom=(platY(sess.pos)+22)+'px'; track.style.transform=`translateX(${-Math.max(0,sess.pos*STEP-60)}px)`; }
  // runner sits in obby coords; track shifts. Keep runner relative to visible area:
  place();
  function hud(){ $('#hudStreak').textContent='Sērija '+sess.streak; $('#hudCoins').textContent='+'+sess.coins; }
  function nextQ(){
    const q = genQ();
    renderQ($('#qbox'), q, ok=>{ nextQ(); });
    // hook answer result via wrapper
    const origFinish = null;
    watch(q);
  }
  function watch(q){
    // observe feedback creation to apply result once
    const box=$('#qbox'); const mo = new MutationObserver(()=>{ const fb=box.querySelector('.feedback'); if(fb){ mo.disconnect(); applyResult(q, fb.classList.contains('good')); } }); mo.observe(box,{childList:true,subtree:true});
  }
  function applyResult(q, ok){
    record(q, ok); sess.total++;
    if(ok){
      sess.correct++; sess.streak++; sess.pos++; sess.coins++; addCoins(1); S.xp+=2;
      if(sess.streak > S.bestStreak) S.bestStreak = sess.streak;
      runner.classList.remove('jump','oops'); void runner.offsetWidth; runner.classList.add('jump'); beep('good');
      if(sess.pos%10===0){ sess.coins+=5; addCoins(5); setTimeout(()=>{ beep('coin'); toast('Karogs! +5 monētas'); },350); }
    } else {
      sess.streak=0; runner.classList.remove('jump','oops'); void runner.offsetWidth; runner.classList.add('oops'); beep('bad');
    }
    place(); hud(); save();
  }
  function finishSession(){
    keyHandler=null;
    if(!sess.total){ go(opts.world==='math'?'mathSetup':'lv'); return; }
    const p = Math.round(100*sess.correct/sess.total);
    app.innerHTML = `${backBtn('home','Uz sākumu')}<div class="panel" style="text-align:center">
      <h1 class="screen-title">Trase pabeigta!</h1>
      <div class="big">${sess.pos}</div><p class="muted" style="margin:4px 0 14px">bloki uzkāpti</p>
      <p style="font-size:18px">Pareizi ${sess.correct} no ${sess.total} (${p}%) · nopelnītas ${sess.coins} monētas</p>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="blk c-mint" id="again">Vēlreiz</button><button class="blk c-grape" data-go="progress">Mans progress</button></div></div>`;
    wireGo(app); $('#again').onclick=()=>go('practice',opts);
  }
  $('#endBtn').onclick = finishSession;
  hud(); nextQ();
}

/* ============ TEST ============ */
function viewTest(app, opts){
  const world = opts.world;
  if(world==='grand' && masteredCount()<20){
    app.innerHTML = `${backBtn('progress')}<div class="panel" style="text-align:center"><h1 class="screen-title">Lielais eksāmens</h1>
      <p class="lead" style="margin:8px auto 16px">Eksāmens atveras, kad apgūtas visas 20 tabulas. Tagad apgūtas ${masteredCount()} no 20.</p>
      <button class="blk c-grape" data-go="progress">Skatīt progresu</button></div>`;
    wireGo(app); return;
  }
  const N = world==='mission'? 15 : world==='grand'? EXAM_N : 20;
  const qs = world==='math'? mathTest() : world==='mission'? missionQs() : world==='grand'? grandQs() : Array.from({length:N}, ()=>qLv('mix'));
  const res = [];
  const TITLE = {math:'Reizrēķina pārbaudījums', mission:'Dienas misija', grand:'Lielais eksāmens', lv:'Vārdu pils pārbaudījums'};
  const lead = world==='grand'? `${N} jautājumi par visām tabulām no 1 līdz 10. Vajag vismaz ${EXAM_PASS} pareizi.` : `${N} jautājumi. Rezultāts tiks saglabāts progresā.`;
  const home = world==='grand'? 'progress' : 'home';
  app.innerHTML = `${backBtn(home,'Pārtraukt')}
    <h1 class="screen-title">${TITLE[world]}</h1>
    <p class="lead" style="margin-bottom:6px">${lead}</p>
    <div class="progressbar" id="pb"></div><p class="muted" id="pbl" style="margin:0"></p>
    <div id="qbox"></div>`;
  wireGo(app);
  function bar(){ $('#pb').innerHTML = res.map(r=>`<i style="width:${100/N}%;background:${r?'var(--good)':'var(--bad)'}"></i>`).join(''); $('#pbl').textContent = `Jautājums ${Math.min(res.length+1,N)} no ${N}`; }
  function ask(i){
    bar();
    if(i>=N) return done();
    const q = qs[i];
    renderQ($('#qbox'), q, ()=>ask(i+1));
    const box=$('#qbox'); const mo=new MutationObserver(()=>{ const fb=box.querySelector('.feedback'); if(fb){ mo.disconnect(); const ok=fb.classList.contains('good'); res.push(ok); record(q,ok); ok?beep('good'):beep('bad'); bar(); } }); mo.observe(box,{childList:true,subtree:true});
  }
  function done(){
    keyHandler=null;
    const c = res.filter(Boolean).length, p = Math.round(100*c/N);
    const stars = p>=90?3:p>=70?2:p>=50?1:0;
    const daily = world==='mission' && S.lastMission!==todayStr();
    if(world==='mission') S.lastMission = todayStr();
    const passed = world==='grand' && c>=EXAM_PASS, firstGrand = passed && !S.rewards.grand;
    if(world==='grand') S.examBest = Math.max(S.examBest||0, c);
    if(firstGrand){ S.rewards.grand = Date.now(); S.grandScore = c; }
    const earned = c + (stars===3?10:0) + (daily?15:0);
    addCoins(earned); S.xp += c*3;
    S.tests.push({d:Date.now(), w:world, c, n:N, s:stars}); if(S.tests.length>60) S.tests = S.tests.slice(-60);
    save(); beep('coin');
    const wrongSkills = {};
    qs.forEach((q,i)=>{ if(!res[i]){ const k = (q.skill[0]==='lv'||q.skill[0]==='ex')? SKILL_LABEL[q.skill[1]] : (q.skill[0]==='mul'?`× ${q.skill[1]}`:`: ${q.skill[1]}`); wrongSkills[k]=(wrongSkills[k]||0)+1; } });
    const ws = Object.entries(wrongSkills).sort((a,b)=>b[1]-a[1]);
    let msg = stars===3?'Izcili! Tu esi īsts meistars.':stars===2?'Ļoti labi! Vēl mazliet treniņa.':stars===1?'Labs sākums! Patrenējies un mēģini vēlreiz.':'Nekas! Patrenējies trasē un mēģini vēlreiz.';
    if(world==='grand') msg = passed? 'Eksāmens nokārtots! Tu zini visu reizrēķinu un dalīšanu.' : `Vajag vismaz ${EXAM_PASS} pareizi. Patrenē tabulas, kurās kļūdījies, un mēģini vēlreiz!`;
    app.innerHTML = `${backBtn(home, home==='home'?'Uz sākumu':'Atpakaļ')}<div class="panel" style="text-align:center">
      <h1 class="screen-title">Rezultāts</h1>
      <div class="stars">${[1,2,3].map(n=>starSVG(n<=stars)).join('')}</div>
      <div class="big">${c} / ${N}</div>
      <p style="font-size:19px;margin:10px 0 4px">${msg}</p>
      <p class="muted">Nopelnītas ${earned} monētas${stars===3?' · 10 bonusā par trīs zvaigznēm':''}${daily?' · 15 par dienas misiju':''}.</p>
      ${ws.length?`<p style="margin-top:14px">Vēl jātrenē: ${ws.map(([k,n])=>`<b>${esc(k)}</b> (${n})`).join(', ')}</p>`:''}
      <div class="row" style="justify-content:center;margin-top:16px">${passed?'':'<button class="blk c-mint" id="again">Vēlreiz</button>'}<button class="blk c-grape" data-go="progress">Mans progress</button></div></div>`;
    wireGo(app); const ag=$('#again'); if(ag) ag.onclick=()=>go('test',{world});
    if(firstGrand) setTimeout(()=>celebrate('grand'),500);
  }
  ask(0);
}

/* ============ PROGRESS ============ */
function mastery(o){ const r=o.r||[]; if(!r.length) return 0; if(isMastered(o)) return 3; return recentCorrect(o)/r.length>=.7? 2 : 1; }
function viewProgress(app){
  const tiles = (g, sym)=>Array.from({length:10},(_,i)=>i+1).map(n=>{ const o=S.stats[g][n], m=mastery(o), r=o.r||[], rc=recentCorrect(o);
    return `<button class="tile m${m}" data-g="${g}" data-n="${n}" aria-label="${sym} ${n}: ${r.length? rc+' pareizi no pēdējām '+r.length : 'nav trenēts'}"><div class="x">${sym}${n}</div><div class="p">${r.length? (m===3?'✓ ':'')+rc+'/'+MASTER_N : '—'}</div></button>`; }).join('');
  const barRows = (g, list)=> list.map(([k,l,c])=>{
    const o=S.stats[g][k], p=pct(o);
    return `<div class="barrow"><div class="lab"><span>${l}</span><span class="muted">${p===null?'vēl nav spēlēts':p+'% · '+o.t+' atbildes'}</span></div><div class="progressbar" style="margin:4px 0 0"><i style="width:${p||0}%;background:${c};${p?'':'border:0'}"></i></div></div>`; }).join('');
  const lvRows = barRows('lv',[['pos','Vārdšķiras','var(--aqua)'],['num','Vienskaitlis un daudzskaitlis','var(--grape)'],['sent','Vārdi teikumā','var(--lava)'],['subj','Priekšmets un izteicējs','var(--mint)'],['read','Lasītā izpratne','var(--sun)']]);
  const exRows = barRows('ex',[['word','Teksta uzdevumi','var(--aqua)'],['ten','Ar 10 un 100','var(--grape)'],['prop','Nezināmais skaitlis','var(--lava)']]);
  const last = S.tests.slice(-10);
  const chart = last.length? `<div class="chart">${last.map(t=>`<div class="col"><span>${Math.round(100*t.c/t.n)}%</span><i style="height:${Math.max(4,Math.round(100*t.c/t.n))}%;background:${WCOLOR[t.w]||'var(--grey)'}"></i></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--sun)"></i>Reizrēķins</span><span><i style="background:var(--grape)"></i>Latviešu valoda</span><span><i style="background:var(--mint)"></i>Dienas misija</span><span><i style="background:var(--lava)"></i>Lielais eksāmens</span></div>` : `<p class="muted">Vēl nav neviena pārbaudījuma. Izpildi pirmo, un šeit parādīsies grafiks.</p>`;
  const hist = S.tests.slice(-8).reverse().map(t=>`<div><span>${new Date(t.d).toLocaleDateString('lv-LV',{day:'numeric',month:'short'})} · ${WNAME[t.w]||t.w}</span><span>${t.c}/${t.n} ${'★'.repeat(t.s)}${'☆'.repeat(3-t.s)}</span></div>`).join('');

  let weak=null;
  ['mul','div'].forEach(g=>{ for(let n=1;n<=10;n++){ const o=S.stats[g][n]; if(o.t>=3){ const p=o.c/o.t; if(!weak||p<weak.p) weak={p,g,n}; } } });
  ['lv','ex'].forEach(g=>Object.entries(S.stats[g]).forEach(([k,o])=>{ if(o.t>=3){ const p=o.c/o.t; if(!weak||p<weak.p) weak={p,g,n:k}; } }));
  let sugg='';
  if(weak && weak.p<.9){
    const lbl = (weak.g==='lv'||weak.g==='ex')? SKILL_LABEL[weak.n] : (weak.g==='mul'?`reizināšana ar ${weak.n}`:`dalīšana ar ${weak.n}`);
    sugg = `<div class="panel" style="margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1 1 240px"><h3 class="disp" style="font-size:22px">Ko trenēt tālāk</h3><p class="muted" style="margin:4px 0 0">Visvairāk jātrenē: ${lbl} (${Math.round(weak.p*100)}% pareizi).</p></div><button class="blk c-mint" id="trainWeak">Trenēt tagad</button></div>`;
  }

  app.innerHTML = `${backBtn()}
    <h1 class="screen-title">Mans progress</h1>
    ${rewardRoad()}
    <div class="section"><h2>Statistika</h2><div class="stats4">
      <div class="panel stat"><div class="v">${level()}</div><div class="l">līmenis</div></div>
      <div class="panel stat"><div class="v">${S.totalCorrect}</div><div class="l">pareizas atbildes</div></div>
      <div class="panel stat"><div class="v">${S.bestStreak}</div><div class="l">garākā sērija</div></div>
      <div class="panel stat"><div class="v">${S.tests.length}</div><div class="l">pārbaudījumi</div></div>
    </div></div>
    ${sugg}
    <div class="section"><h2>Reizināšana</h2><p class="muted" style="margin:0">Skaitlis rāda pareizās atbildes no pēdējām ${MASTER_N}. Pieskaries tabulai, lai to trenētu.</p><div class="tiles">${tiles('mul','×')}</div></div>
    <div class="section"><h2>Dalīšana</h2><div class="tiles">${tiles('div',':')}</div>
      <div class="legend"><span><i style="background:var(--grey)"></i>Nav trenēts</span><span><i style="background:var(--lava)"></i>Jātrenē</span><span><i style="background:var(--sun)"></i>Gandrīz</span><span><i style="background:var(--mint)"></i>Apgūts (${MASTER_NEED} no ${MASTER_N})</span></div></div>
    <div class="section"><h2>Matemātikas uzdevumi</h2><div class="panel bars">${exRows}</div></div>
    <div class="section"><h2>Latviešu valoda</h2><div class="panel bars">${lvRows}</div></div>
    <div class="section"><h2>Pārbaudījumi</h2><div class="panel">${chart}${hist?`<div class="hist">${hist}</div>`:''}</div></div>
    <div class="section"><h2>Vecākiem</h2><div class="panel">
      <h3 class="disp" style="font-size:22px">Glabāšana serverī</h3>
      <p class="muted" id="cloudStatus" style="margin:4px 0 8px">${cloudStatusHTML()}</p>
      ${cloudAvail?`<div class="row" style="margin-top:10px"><button class="blk sm ghost" id="cList">Servera dienas kopijas</button></div><div id="cDays" class="hist"></div>`:''}
    </div></div>`;
  wireGo(app);
  app.querySelectorAll('.tile,.seg').forEach(t=>t.onclick=()=>go('practice',{world:'math',tables:[+t.dataset.n],op:t.dataset.g}));
  const tw=$('#trainWeak'); if(tw) tw.onclick=()=>{ if(weak.g==='ex') go('practice',{world:'math',mode:weak.n}); else if(weak.g==='lv') go('practice',{world:'lv',mode: weak.n==='subj'?'sent':weak.n}); else go('practice',{world:'math',tables:[weak.n],op:weak.g}); };
  if(cloudAvail){
    let armedDay='';
    $('#cList').onclick=async()=>{
      const box=$('#cDays');
      if(!cloud.ok){ toast('Nav savienojuma ar serveri'); return; }
      box.innerHTML='<div><span class="muted">Ielādē…</span></div>';
      try{
        const r=await cloudFetch('GET','?list=1');
        const days=(r.data&&r.data.days)||[];
        if(!days.length){ box.innerHTML='<div><span class="muted">Vēl nav nevienas kopijas.</span></div>'; return; }
        box.innerHTML=days.map(d=>{ const pre=/-pirms$/.test(d), dd=d.slice(0,10); const [y,m,da]=dd.split('-').map(Number);
          return `<div><span>${new Date(y,m-1,da).toLocaleDateString('lv-LV',{day:'numeric',month:'long'})}${pre?' (pirms progresa samazināšanās)':''}</span><button class="blk sm ghost" data-day="${d}">Atjaunot</button></div>`; }).join('');
        box.querySelectorAll('[data-day]').forEach(b=>b.onclick=async()=>{
          const d=b.dataset.day;
          if(armedDay!==d){ armedDay=d; b.textContent='Spied vēlreiz, lai atjaunotu'; return; }
          armedDay='';
          const r2=await cloudFetch('GET','?day='+encodeURIComponent(d));
          if(r2.status===200 && r2.data && r2.data.state){ S=normalize(r2.data.state); petKey=''; save(); toast('Progress atjaunots'); viewProgress(app); }
          else toast('Neizdevās atjaunot');
        });
      }catch(e){ box.innerHTML='<div><span class="muted">Nav savienojuma ar serveri.</span></div>'; }
    };
  }
}

        <div class="namefield" style="margin-top:0"><input id="catNm" maxlength="14" value="${esc(S.catName)}" aria-label="Kaķa vārds"><button class="blk sm c-mint" id="saveCat">Saglabāt vārdu</button></div>
        <button class="blk sm ghost" id="petToggle" style="margin-top:12px">${S.petOn!==false?'Paslēpt kaķi':'Rādīt kaķi'}</button></div></div>`
    : `<div class="panel row"><div style="width:96px;filter:grayscale(1) brightness(.75)">${catSVG(false)}</div><p class="muted" style="flex:1 1 220px;margin:0">🔒 Kaķis atveras, kad kopā nopelnītas ${GOAL_CAT} monētas. Vēl jānopelna ${Math.max(0,GOAL_CAT-S.earned)}.</p></div>`;
  app.innerHTML = `${backBtn()}
    <h1 class="screen-title">Veikals</h1>
    <p class="lead">Tev ir ${S.coins} monētas. Kopā nopelnītas ${S.earned} — tās atver īpašās balvas, un pirkumi tās nesamazina.</p>
    <div class="panel"><h2 style="font-size:22px">Spēlētāja vārds</h2>
      <div class="namefield"><input id="nm" maxlength="16" value="${esc(S.name)}" aria-label="Spēlētāja vārds"><button class="blk sm c-mint" id="saveNm">Saglabāt</button></div></div>
    <div class="section"><h2>Forma</h2><div class="shopgrid">${formCard('normal','Parastā')}${formCard('champ','Čempions')}</div></div>
    <div class="section"><h2>Kaķis</h2>${catPanel}</div>
    <div class="section"><h2>Krāsas</h2><div class="shopgrid">${COLORS.map(c=>card('color',c)).join('')}</div></div>
    <div class="section"><h2>Cepures</h2><div class="shopgrid">${HATS.map(h=>card('hat',h)).join('')}</div></div>`;
  wireGo(app);
  $('#saveNm').onclick=()=>{ const v=$('#nm').value.trim(); if(!v){ toast('Ieraksti vārdu'); return; } S.name=v; save(); toast('Vārds saglabāts'); };
  if(catOK){
    $('#saveCat').onclick=()=>{ const v=$('#catNm').value.trim(); if(!v){ toast('Ieraksti kaķa vārdu'); return; } S.catName=v; save(); toast(`Kaķa vārds: ${v}`); };
    $('#petToggle').onclick=()=>{ S.petOn = S.petOn===false; save(); viewShop(app); };
  }
  app.querySelectorAll('.item[data-k="form"]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(id==='champ' && !champOK){ toast(`Atveras pie ${GOAL_TROPHY} nopelnītām monētām (tev ${S.earned})`); return; }
    S.form=id; save(); viewShop(app);
  });
  app.querySelectorAll('.item[data-k="color"], .item[data-k="hat"]').forEach(b=>b.onclick=()=>{
    const kind=b.dataset.k, id=b.dataset.id, it=(kind==='color'?COLORS:HATS).find(x=>x.id===id);
    if(!S.owned.includes(id)){
      if(S.coins<it.price){ toast(`Vajag vēl ${it.price-S.coins} monētas`); return; }
      S.coins-=it.price; S.owned.push(id); beep('coin'); toast(`Nopirkts: ${it.name}`);
    }
    if(kind==='color') S.color=id; else S.hat=id;
    save(); viewShop(app);
  });
}

renderTop();
go('home');
cloudPull();
</script>
</body>
</html>
